<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef3f5">
  <meta name="description" content="Your Yu-Gi-Oh! card archive, deck workshop, and classic Solo Duel. Duel Atlas v0.4.12.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Duel Atlas">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/emblem.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./duel.css">
  <link rel="stylesheet" href="./light.css">
  <link rel="stylesheet" href="./effects.css">
  <link rel="stylesheet" href="./battle.css">
  <link rel="stylesheet" href="./menus.css">
  <link rel="stylesheet" href="./workshop.css">
  <title>Duel Atlas · Yu-Gi-Oh! Companion</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Duel Atlas home"><img src="./assets/emblem.svg" alt="" width="36" height="36"><span>DUEL <b>ATLAS</b><small>YU-GI-OH! COMPANION</small></span></a>
      <span class="release">v0.4.12 <span>TEST BUILD</span></span>
      <button class="icon-button" id="app-menu" aria-label="App information, install help, and settings" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-route="home"><span data-icon="home"></span><span>Home</span></button>
      <button data-route="archive"><span data-icon="archive"></span><span>Archive</span></button>
      <button data-route="decks"><span data-icon="deck"></span><span>Deck Builder</span></button>
      <button data-route="solo"><span data-icon="solo"></span><span>Solo Duel</span></button>
      <button data-route="multiplayer"><span data-icon="people"></span><span>Multiplayer</span></button>
    </nav>
  </div>
  <dialog id="modal" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="card-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <input id="import-file" type="file" accept=".json,.ydk,application/json,text/plain" hidden>
  <noscript>This app needs JavaScript to browse cards and build decks.</noscript>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
